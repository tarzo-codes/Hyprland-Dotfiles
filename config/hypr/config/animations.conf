# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Refined subtle liquid bezier curves (Subtle macOS Inertia)
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    bezier = fluid, 0.05, 0.9, 0.1, 1.03
    bezier = liquidBounce, 0.25, 1.05, 0.45, 1.0
    bezier = liquidRipple, 0.16, 1.04, 0.3, 1.02
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = oversmooth, 0.13, 0.99, 0.29, 1.03

    # Windows animations (Subtle macOS Liquid Motion)
    animation = windows, 1, 4.0, oversmooth, popin 88%
    animation = windowsIn, 1, 3.8, oversmooth, popin 88%
    animation = windowsOut, 1, 3.0, smoothOut, popin 88%
    animation = windowsMove, 1, 3.8, liquidRipple, slide

    # Fade animations
    animation = fade, 1, 3.2, smoothIn
    animation = fadeIn, 1, 3.0, smoothIn
    animation = fadeOut, 1, 2.5, smoothIn

    # Layer shell animations (Quickshell, Mako, Vicinae, Rofi)
    animation = layers, 1, 3.5, oversmooth, fade
    animation = layersIn, 1, 3.2, oversmooth, fade
    animation = layersOut, 1, 2.2, smoothIn, fade

    # Workspaces animations
    animation = workspaces, 1, 3.8, oversmooth, slidefade 15%
    animation = workspacesIn, 1, 3.6, oversmooth, slidefade 15%
    animation = workspacesOut, 1, 3.0, smoothOut, slidefade 15%

    # Subtle Liquid Border & Rotation Effect
    animation = border, 1, 6, fluid
    animation = borderangle, 1, 45, linear, loop
}
