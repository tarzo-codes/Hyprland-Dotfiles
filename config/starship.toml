# Wallust generated starship.toml — dynamic contrast colors
# Mode: dark
# SEG1=#C2E1F2 SEG2=#97D3F6 SEG3=#FF7D5C TIME_BG=#2174BD

format = """
[](#C2E1F2)\
$os\
$username\
[](bg:#97D3F6 fg:#C2E1F2)\
$directory\
[](bg:#FF7D5C fg:#97D3F6)\
$git_branch\
$git_status\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$conda\
$pixi\
[](fg:#FF7D5C bg:#2174BD)\
$time\
[ ](fg:#2174BD)\
$line_break$character"""

[os]
disabled = false
style = "bg:#C2E1F2 fg:#12121a"

[os.symbols]
CachyOS = "󰣇"
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:#C2E1F2 fg:#12121a"
style_root  = "bg:#C2E1F2 fg:#12121a"
format = '[ $user ]($style)'

[directory]
style = "fg:#12121a bg:#97D3F6"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music"     = "󰝚 "
"Pictures"  = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style  = "bg:#FF7D5C"
format = '[[ $symbol $branch ](fg:#12121a bg:#FF7D5C)]($style)'

[git_status]
style  = "bg:#FF7D5C"
format = '[[($all_status$ahead_behind )](fg:#12121a bg:#FF7D5C)]($style)'

[nodejs]
symbol = ""
style  = "bg:#FF7D5C"
format = '[[ $symbol( $version) ](fg:#12121a bg:#FF7D5C)]($style)'

[bun]
symbol = ""
style  = "bg:#FF7D5C"
format = '[[ $symbol( $version) ](fg:#12121a bg:#FF7D5C)]($style)'

[c]
symbol = " "
style  = "bg:#FF7D5C"
format = '[[ $symbol( $version) ](fg:#12121a bg:#FF7D5C)]($style)'

[cpp]
symbol = " "
style  = "bg:#FF7D5C"
format = '[[ $symbol( $version) ](fg:#12121a bg:#FF7D5C)]($style)'

[rust]
symbol = ""
style  = "bg:#FF7D5C"
format = '[[ $symbol( $version) ](fg:#12121a bg:#FF7D5C)]($style)'

[golang]
symbol = ""
style  = "bg:#FF7D5C"
format = '[[ $symbol( $version) ](fg:#12121a bg:#FF7D5C)]($style)'

[php]
symbol = ""
style  = "bg:#FF7D5C"
format = '[[ $symbol( $version) ](fg:#12121a bg:#FF7D5C)]($style)'

[java]
symbol = ""
style  = "bg:#FF7D5C"
format = '[[ $symbol( $version) ](fg:#12121a bg:#FF7D5C)]($style)'

[kotlin]
symbol = ""
style  = "bg:#FF7D5C"
format = '[[ $symbol( $version) ](fg:#12121a bg:#FF7D5C)]($style)'

[haskell]
symbol = ""
style  = "bg:#FF7D5C"
format = '[[ $symbol( $version) ](fg:#12121a bg:#FF7D5C)]($style)'

[python]
symbol = ""
style  = "bg:#FF7D5C"
format = '[[ $symbol( \($virtualenv\))( $version) ](fg:#12121a bg:#FF7D5C)]($style)'

[docker_context]
symbol = ""
style  = "bg:#FF7D5C"
format = '[[ $symbol( $context) ](fg:#12121a bg:#FF7D5C)]($style)'

[conda]
style  = "bg:#FF7D5C"
format = '[[ $symbol( $environment) ](fg:#12121a bg:#FF7D5C)]($style)'

[pixi]
style  = "bg:#FF7D5C"
format = '[[ $symbol( $version)( $environment) ](fg:#12121a bg:#FF7D5C)]($style)'

[cmd_duration]
format = "[󱑂 $duration]($style)"
style  = "fg:#97D3F6"

[time]
disabled    = false
time_format = "%R"
style       = "bg:#2174BD"
format      = '[[ $time ](fg:#ffffff bg:#2174BD)]($style)'

[line_break]
disabled = false

[character]
disabled               = false
success_symbol         = '[❯ ](bold fg:#97D3F6)'
error_symbol           = '[❯ ](bold fg:#362756)'
vimcmd_symbol          = '[❮ ](bold fg:#97D3F6)'
vimcmd_replace_one_symbol = '[❮ ](bold fg:#97D3F6)'
vimcmd_replace_symbol  = '[❮ ](bold fg:#97D3F6)'
vimcmd_visual_symbol   = '[❮ ](bold fg:#97D3F6)'
